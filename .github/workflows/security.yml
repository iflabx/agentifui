name: Security Checks

on:
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2:00 AM
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    outputs:
      audit_status: ${{ steps.audit.outputs.status }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.22.2'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
        
    - name: Run pnpm audit
      id: audit
      run: |
        node <<'NODE'
        const { spawnSync } = require('node:child_process');
        const { appendFileSync } = require('node:fs');
        const result = spawnSync('pnpm', ['audit', '--audit-level=moderate', '--json'], {
          encoding: 'utf8',
          timeout: 120000,
        });
        let status = 'error';
        try {
          const report = JSON.parse(result.stdout);
          const counts = ['moderate', 'high', 'critical'].map(
            severity => report.metadata?.vulnerabilities?.[severity]
          );
          if (!result.error && [0, 1].includes(result.status) && !report.error &&
              counts.every(count => Number.isInteger(count) && count >= 0)) {
            const total = counts.reduce((sum, count) => sum + count, 0);
            if ((result.status === 0) === (total === 0)) {
              status = total > 0 ? 'vulnerabilities' : 'passed';
              console.log(`Dependency vulnerabilities (moderate or higher): ${total}`);
            }
          }
        } catch {
          status = 'error';
        }
        appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`);
        if (status === 'error') {
          console.error('::error::Dependency audit did not complete successfully. Check registry availability and pnpm audit output locally.');
          process.exitCode = 1;
        } else if (status === 'vulnerabilities') {
          console.log('::warning::Dependency vulnerabilities detected. Run pnpm audit for details; findings remain non-blocking.');
        }
        NODE

  code-security:
    name: Source Code Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.22.2'
    - uses: ./.github/actions/publication-check

  security-report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security]
    if: always()
    
    steps:
    - name: Generate security report
      env:
        DEPENDENCY_RESULT: ${{ needs.dependency-scan.result }}
        AUDIT_STATUS: ${{ needs.dependency-scan.outputs.audit_status }}
        CODE_RESULT: ${{ needs.code-security.result }}
      run: |
        node <<'NODE'
        const { appendFileSync } = require('node:fs');
        const { DEPENDENCY_RESULT, AUDIT_STATUS, CODE_RESULT } = process.env;
        let overall;
        if (DEPENDENCY_RESULT !== 'success' || CODE_RESULT !== 'success' ||
            !['passed', 'vulnerabilities'].includes(AUDIT_STATUS)) {
          overall = 'Checks failed or incomplete. See job logs.';
          process.exitCode = 1;
        } else if (AUDIT_STATUS === 'vulnerabilities') {
          overall = 'Attention required: dependency vulnerabilities detected (non-blocking).';
        } else {
          overall = 'No findings reported by configured checks; this is not a security guarantee.';
        }
        const summary = [
          '## Security Check Report',
          `Dependency scan: ${DEPENDENCY_RESULT}; audit: ${AUDIT_STATUS || 'not completed'}`,
          `Publication check: ${CODE_RESULT}`,
          `Overall: ${overall}`,
        ].join('\n\n');
        console.log(summary);
        appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
        NODE
