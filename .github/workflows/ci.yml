name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel previous runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.2'

jobs:
  publication-check:
    name: Publication Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/publication-check

  # Check if files have changed to skip unnecessary jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.runtime == 'true' }}
      docker_required: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runtime: &runtime_paths
              - 'app/**'
              - 'apps/**'
              - 'packages/**'
              - 'lib/**'
              - 'components/**'
              - 'hooks/**'
              - 'providers/**'
              - 'messages/**'
              - 'styles/**'
              - 'database/**'
              - 'docker/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - '__tests__/scripts/**'
              - '**/*.{ts,tsx,js,jsx,mjs,cjs,json,css,scss,sql,sh,yml,yaml}'
              - 'public/**'
              - 'content/**'
              - '**/Dockerfile*'
              - '**/.dockerignore'
              - 'package.json'
              - 'pnpm*'
              - 'next.config.*'
              - 'tsconfig*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - '.npmrc'
              - '.env*.example'
              - '.nvmrc'
              - '.prettierignore'
              - '.gitignore'
            docker: *runtime_paths

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.required == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting on changed files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" != "" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="$(git hash-object -t tree /dev/null)..${{ github.sha }}"
          fi

          echo "Using diff range: $RANGE"
          mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=ACMRT "$RANGE")

          if [ ${#CHANGED_FILES[@]} -gt 0 ]; then
            echo "Running Prettier on changed files"
            pnpm exec prettier --check --ignore-unknown "${CHANGED_FILES[@]}"
          else
            echo "No changed files found in this event"
          fi

      - name: Run ESLint on changed files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" != "" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="$(git hash-object -t tree /dev/null)..${{ github.sha }}"
          fi

          echo "Using diff range: $RANGE"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$RANGE" | grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$' | tr '\n' ' ' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Running ESLint on changed files: $CHANGED_FILES"
            pnpm exec eslint --cache --cache-location node_modules/.cache/eslint/.eslint-cache $CHANGED_FILES
          else
            echo "No JS/TS files changed in this event"
          fi

      - name: Run TypeScript type checks
        run: |
          pnpm run type-check
          pnpm --filter @agentifui/shared type-check
          pnpm --filter @agentifui/api type-check

  verify:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.required == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: agentifui_test
          POSTGRES_USER: agentif
          POSTGRES_PASSWORD: agentif
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentif -d agentifui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      GO_VERSION: '1.24.8'
      MINIO_COMMIT: '9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a'
      MC_COMMIT: '7394ce0dd2a80935aded936b09fa12cbb3cb8096'
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://agentif:agentif@127.0.0.1:5432/agentifui_test
      MIGRATOR_DATABASE_URL: postgresql://agentif:agentif@127.0.0.1:5432/agentifui_test
      REDIS_URL: redis://127.0.0.1:6379/2
      REDIS_PREFIX: agentifui-test
      CACHE_L2_KEY_PREFIX: agentifui-test:cache:l2
      CACHE_L2_INVALIDATION_CHANNEL: agentifui-test:cache:l2:invalidate
      REALTIME_REDIS_CHANNEL: agentifui-test:realtime:events
      REALTIME_REDIS_STREAM_KEY: agentifui-test:realtime:events:stream
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: agentifui-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_ENABLE_PATH_STYLE: '1'
      BETTER_AUTH_SECRET: ci-test-only-secret-do-not-use-in-prod
      API_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Cache CI object-storage tools
        id: s3-tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-s3/bin
          key: ci-s3-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ env.MINIO_COMMIT }}-${{ env.MC_COMMIT }}

      - name: Setup Go for CI object-storage tools
        if: steps.s3-tools.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build pinned official object-storage tools
        if: steps.s3-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/ci-s3/bin
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          mkdir -p "$GOBIN"
          go install "github.com/minio/minio@$MINIO_COMMIT"
          go install "github.com/minio/mc@$MC_COMMIT"

      - name: Start MinIO
        run: |
          MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
          MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
          "$RUNNER_TEMP/ci-s3/bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &

      - name: Initialize MinIO bucket
        run: |
          for _ in {1..60}; do
            if curl -fsS "$S3_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS "$S3_ENDPOINT/minio/health/live" >/dev/null

          export MC_CONFIG_DIR="$RUNNER_TEMP/mc-config"
          "$RUNNER_TEMP/ci-s3/bin/mc" alias set ci "$S3_ENDPOINT" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"
          "$RUNNER_TEMP/ci-s3/bin/mc" mb --ignore-existing "ci/$S3_BUCKET"
        env:
          S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_ACCESS_KEY }}

      - name: Ensure PostgreSQL client
        run: |
          if command -v psql >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        run: |
          shopt -s nullglob
          migrations=(database/migrations/*.sql)
          if [ ${#migrations[@]} -eq 0 ]; then
            echo "No SQL migrations found" >&2
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Install publication test scanner
        uses: ./.github/actions/publication-check
        with:
          install-only: 'true'

      - name: Run tests
        run: pnpm test --maxWorkers=2

      - name: Build application and workspace packages
        if: needs.changes.outputs.docker_required != 'true'
        env:
          NODE_ENV: production
        run: pnpm run build:all

  docker:
    name: Docker Build and Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.docker_required == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: agentifui:ci
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=http://127.0.0.1:23300
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build source MinIO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.storage
          target: minio
          platforms: linux/amd64
          load: true
          push: false
          tags: agentifui-minio:source-9e49d5e7
          cache-from: type=gha,scope=storage
          cache-to: type=gha,scope=storage,mode=max

      - name: Build source MinIO client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.storage
          target: mc
          platforms: linux/amd64
          load: true
          push: false
          tags: agentifui-mc:source-7394ce0d
          cache-from: type=gha,scope=storage
          cache-to: type=gha,scope=storage,mode=max

      - name: Smoke test CI image
        run: node scripts/smoke-docker.mjs --image agentifui:ci

  # Final status check - all jobs must pass
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: 
      - publication-check
      - changes
      - quality
      - verify
      - docker
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all jobs status
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.CI_NEEDS);
          if (needs?.['publication-check']?.result !== 'success') process.exit(1);
          if (needs?.changes?.result !== 'success') process.exit(1);
          const required = needs.changes.outputs?.required;
          const dockerRequired = needs.changes.outputs?.docker_required;
          if (![required, dockerRequired].every(value => ['true', 'false'].includes(value))) process.exit(1);
          for (const [name, flag] of Object.entries({ quality: required, verify: required, docker: dockerRequired })) {
            if (needs[name]?.result !== (flag === 'true' ? 'success' : 'skipped')) {
              console.error(`${name}: unexpected ${needs[name]?.result}`);
              process.exit(1);
            }
          }
          console.log('All required CI checks passed');
          NODE
